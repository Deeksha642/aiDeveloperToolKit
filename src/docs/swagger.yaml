openapi: 3.0.3

info:
  title: AI Developer Toolkit API
  version: 1.0.0
  description: AI powered backend developer toolkit

servers:
  - url: http://localhost:3000/api/v1

paths:
  /health:
    get:
      summary: Health Check
      responses:
        '200':
          description: Success

  /ai/review-code:
    post:
      summary: Review source code using AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                language:
                  type: string
                code:
                  type: string
      responses:
        '200':
          description: AI Review